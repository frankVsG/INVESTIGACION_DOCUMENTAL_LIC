<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login con RegEx</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<div class="container d-flex justify-content-center align-items-center vh-100" style="max-width: 420px;">
		<div class="card shadow p-4 rounded-4">
			<h3 class="text-center mb-3 fw-bold text-primary">Login con Expresiones Regulares</h3>
			<form onsubmit="return false;">
				<div class="mb-3">
					<label class="form-label fw-semibold">Correo electrónico:</label>
					<input type="email" id="idEmail" class="form-control" placeholder="correo@ejemplo.com">
				</div>
				<div class="mb-3">
					<label class="form-label fw-semibold">Contraseña:</label>
					<input type="password" id="idPass" class="form-control" placeholder="Mínimo 8 caracteres">
				</div>
				<ul class="small text-muted ps-3 mb-4">
					<li id="reqLargo" class="text-danger">Mínimo 8 caracteres</li>
					<li id="reqMayus" class="text-danger">Al menos una letra mayúscula</li>
					<li id="reqNum" class="text-danger">Al menos un número</li>
				</ul>
				<button type="button" id="idBtn" class="btn btn-primary w-100 fw-bold" disabled>Ingresar</button>
			</form>
		</div>
	</div>
	<script src="js/investigacion.js" defer></script>
</body>
</html>
